services:
  ecommerce-api:
    image: ecommerce-api:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ecommerce-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__Provider: SqlServer
      Database__ConnectionString: Server=db;Database=ECommerce;User Id=sa;Password=ECommerce_Pass123!;TrustServerCertificate=true;
      Jwt__Secret: <CHANGE_ME_IN_PRODUCTION>
      Payments__WebhookSecret: <CHANGE_ME_IN_PRODUCTION>
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ecommerce-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ECommerce_Pass123!"
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - ecommerce-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ECommerce_Pass123! -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  ecommerce-db-data: